services:
  pg-dialog-service:
    image: postgres:16.1-alpine3.18
    container_name: pg-dialog-service
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGPASSWORD: pass
      TZ: Europe/Moscow
    ports:
      - ${DB_PORT}:5432
    volumes:
      - ./pg_data/master/:/var/lib/postgresql/data
    networks:
      shared-net:
        aliases:
          - pg-dialog-service.shared
    hostname: pg-dialog-service
    env_file: ".env"
  redis:
    image: redis:7.2.4
    container_name: redis-container
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
      - ./load_test/dialog_functions.lua:/dialog_functions.lua
    networks:
      shared-net:
        aliases:
          - redis-service.shared
    command:
      - "--appendonly"
      - "yes"
      - "--save"
      - "60 10"
    environment:
      - REDIS_PASSWORD=123123vv
      - REDIS_LRU_LIMIT_MB=1024
  ms-dialog:
    container_name: ms-dialog
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    networks:
      shared-net:
        aliases:
          - ms-dialog
    depends_on:
      - pg-dialog-service
    env_file:
      - .env
  # Zabbix Agent для сбора метрик со всех сервисов
  zabbix-agent-dialog:
    build:
      context: .
      dockerfile: Dockerfile.zabbix-agent
    container_name: zabbix-agent-dialog
    restart: unless-stopped
    environment:
      - ZBX_HOSTNAME=dialog-service-cluster
      - ZBX_SERVER_HOST=zabbix-server # Укажите ваш Zabbix сервер
      - ZBX_ACTIVE_ALLOW=true
      - ZBX_METADATA=dialog,postgres,redis,golang,docker
    volumes:
      - ./zabbix/agent/conf/zabbix_agent2.conf:/etc/zabbix/zabbix_agent2.conf:ro
      - ./zabbix/agent/conf.d/user_parameters.conf:/etc/zabbix/zabbix_agent2.d/user_parameters.conf:ro
      - ./zabbix/agent/scripts:/var/lib/zabbix/scripts:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      shared-net:
        ipv4_address: 172.25.0.16
        aliases:
          - zabbix-agent.shared
    privileged: true
    pid: host

networks:
  shared-net:
    external: true
    name: shared-app-network
