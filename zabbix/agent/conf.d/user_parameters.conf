# PostgreSQL метрики
UserParameter=postgres.connections.total,/var/lib/zabbix/scripts/postgres_metrics.sh connections
UserParameter=postgres.connections.active,/var/lib/zabbix/scripts/postgres_metrics.sh active_connections
UserParameter=postgres.db.size,/var/lib/zabbix/scripts/postgres_metrics.sh db_size
UserParameter=postgres.queries.count,/var/lib/zabbix/scripts/postgres_metrics.sh queries_count
UserParameter=postgres.locks.count,/var/lib/zabbix/scripts/postgres_metrics.sh locks_count
UserParameter=postgres.cache.hitrate,/var/lib/zabbix/scripts/postgres_metrics.sh cache_hitrate
UserParameter=postgres.transactions.rate,/var/lib/zabbix/scripts/postgres_metrics.sh transactions_rate

# Redis метрики
UserParameter=redis.memory.used,/var/lib/zabbix/scripts/redis_metrics.sh memory_used
UserParameter=redis.connected.clients,/var/lib/zabbix/scripts/redis_metrics.sh connected_clients
UserParameter=redis.keys.count,/var/lib/zabbix/scripts/redis_metrics.sh keys_count
UserParameter=redis.hit.rate,/var/lib/zabbix/scripts/redis_metrics.sh hit_rate
UserParameter=redis.ops.persecond,/var/lib/zabbix/scripts/redis_metrics.sh ops_persecond
UserParameter=redis.used.memory.peak,/var/lib/zabbix/scripts/redis_metrics.sh used_memory_peak

# Бизнес-метрики микросервиса
UserParameter=dialog.active.users,/var/lib/zabbix/scripts/dialog_metrics.sh active_users
UserParameter=dialog.messages.total,/var/lib/zabbix/scripts/dialog_metrics.sh total_messages
UserParameter=dialog.sessions.active,/var/lib/zabbix/scripts/dialog_metrics.sh active_sessions
UserParameter=dialog.response.time,/var/lib/zabbix/scripts/dialog_metrics.sh response_time
UserParameter=dialog.health.check,/var/lib/zabbix/scripts/dialog_metrics.sh health_check

# Docker метрики
UserParameter=docker.container.status[*],/var/lib/zabbix/scripts/docker_metrics.sh container_status $1
UserParameter=docker.container.cpu[*],/var/lib/zabbix/scripts/docker_metrics.sh container_cpu $1
UserParameter=docker.container.memory[*],/var/lib/zabbix/scripts/docker_metrics.sh container_memory $1
UserParameter=docker.container.memory.limit[*],/var/lib/zabbix/scripts/docker_metrics.sh container_memory_limit $1
UserParameter=docker.container.network.io[*],/var/lib/zabbix/scripts/docker_metrics.sh container_network_io $1
UserParameter=docker.containers.running,/var/lib/zabbix/scripts/docker_metrics.sh containers_running
UserParameter=docker.containers.total,/var/lib/zabbix/scripts/docker_metrics.sh containers_total

# Системные метрики (уникальные имена)
UserParameter=system.cpu.load.percent,/var/lib/zabbix/scripts/system_metrics.sh cpu_load
UserParameter=system.memory.used.bytes,/var/lib/zabbix/scripts/system_metrics.sh memory_used
UserParameter=system.memory.total.bytes,/var/lib/zabbix/scripts/system_metrics.sh memory_total
UserParameter=system.disk.used.bytes[*],/var/lib/zabbix/scripts/system_metrics.sh disk_used $1
UserParameter=system.disk.total.bytes[*],/var/lib/zabbix/scripts/system_metrics.sh disk_total $1
